[project]
name = "prellm"
version = "0.1.0"
description = "Preprocess images and HTML pages into smaller files for cheaper LLM consumption"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.0.0",
    "Pillow>=11.0.0",
    "resvg-py>=0.5.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13"]

[project.scripts]
prellm = "prellm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["lxml.*", "resvg_py", "pytesseract"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
